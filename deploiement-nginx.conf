# =============================================================================
#  Console d'administration — port dédié, restreint par IP
#
#  Nginx ne sert plus aucun fichier : il termine le TLS, filtre par IP, et
#  transmet tout au conteneur. L'interface et l'API viennent donc de la même
#  image — elles ne peuvent plus diverger, ce qui arrivait quand Nginx servait
#  une copie de l'interface posée sur le disque de l'hôte.
# =============================================================================
server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/enclave.crt;
    ssl_certificate_key /etc/nginx/certs/enclave.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Une requête HTTP en clair sur ce port HTTPS : rediriger plutôt que
    # renvoyer un 400 que personne ne comprend.
    error_page 497 =301 https://$host:8443$request_uri;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # --- Première barrière : restriction par IP, avant tout mot de passe ---
    # ADAPTER aux postes d'administration réels.
    allow 192.168.136.0/24;   # poste d'administration (prototype)
    allow 10.0.10.0/24;       # VLAN de gestion
    allow 127.0.0.1;
    deny  all;

    # Tout au conteneur : interface et API.
    location / {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
