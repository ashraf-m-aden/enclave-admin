# =============================================================================
#  Console d'administration de l'enclave — port dédié, restreint par IP
#
#  Séparée du portail chercheur (443) : la console ne doit pas être
#  atteignable depuis partout où le portail l'est.
# =============================================================================
server {
    listen 8443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/enclave.crt;
    ssl_certificate_key /etc/nginx/certs/enclave.key;
    ssl_protocols       TLSv1.2 TLSv1.3;

    add_header Strict-Transport-Security "max-age=31536000" always;
    add_header X-Frame-Options "DENY" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;

    # --- Restriction par IP : la première barrière, avant tout mot de passe ---
    # ADAPTER aux postes d'administration réels.
    allow 192.168.136.0/24;   # poste d'administration (prototype)
    allow 10.0.10.0/24;       # VLAN de gestion
    allow 127.0.0.1;
    deny  all;

    # API : uniquement la boucle locale côté serveur.
    location /api/ {
        proxy_pass http://127.0.0.1:8090;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Console Vue : fichiers statiques, avec repli sur index.html pour que
    # le routeur en mode history fonctionne sur un rechargement.
    root /opt/enclave/admin/console;
    index index.html;

    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
